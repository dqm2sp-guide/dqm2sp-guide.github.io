function filter(monsters,{q='',family='',rank='',favorites=false}={},save={}){const words=norm(q).split(/[,，]/).filter(Boolean);return monsters.filter(m=>(!family||m.family===family)&&(!rank||m.rank===rank)&&(!favorites||(save.favorites||[]).includes(m.id))&&words.every(w=>norm([m.name,m.id,save.aliases?.[m.id],...(m.aliases||[])].join(' ')).includes(w)));}
function safeSave(raw,ids){let s;try{s=JSON.parse(raw||'{}')}catch{s={}}if(!s||typeof s!=='object')s={};return {favorites:Array.isArray(s.favorites)?s.favorites.filter(x=>ids.has(x)):[],aliases:Object.fromEntries(Object.entries(s.aliases&&typeof s.aliases==='object'?s.aliases:{}).filter(([k,v])=>ids.has(k)&&typeof v==='string'&&v.length<=40))};}

const api={norm,filter,safeSave,tree};if(typeof module!=='undefined')module.exports=api;else root.DQM1Core=api;

</script><script>const D=window.DQM1_DATA,C=window.DQM1Core,$=s=>document.querySelector(s),byId=new Map(D.monsters.map(m=>[m.id,m])),key='dqm1sp-preview-v1';

let saved;try{saved=localStorage.getItem(key)}catch{}let save=C.safeSave(saved,new Set(byId.keys()));let state={q:'',family:'',rank:'',favorites:false},trail=[],tab='in',focusBefore;

function render(){const list=C.filter(D.monsters,state,save);$('#count').textContent=`${list.length} / ${D.monsters.length} 种`;$('#favorites').setAttribute('aria-pressed',state.favorites);$('#cards').innerHTML=list.map(m=>`<button class="card" data-open="${esc(m.id)}"><span class="art">${art(m)}</span><span class="meta">${esc(m.family)} · ${esc(m.rank)} 阶</span><strong>${esc(label(m))}</strong><span class="hint">查看合成材料 → ${save.favorites.includes(m.id)?'★':''}</span></button>`).join('')||'<div class="empty">没有匹配的怪物。试试清空筛选，或取消“我的收藏”。</div>'}

function branch(n){if(n.cycle)return '<p class="quiet">循环关系，停止展开。</p>';if(n.missing)return '<p class="quiet">材料资料尚未收录。</p>';return `<div class="tree">${parent(n.id)}${n.recipes.length?`<details><summary>展开材料</summary>${n.recipes.map(r=>`<p class="quiet">${r.type==='four'?'四体祖辈':'双亲配合'}</p>${r.children.map(branch).join('')}`).join('')}</details>`:'<p class="quiet">到这里可查看入手地点。</p>'}</div>`}
function acquisition(m){return (m.acquisition||[]).map(p=>`<article class="place"><strong>⌖ ${esc(p.place)}</strong><p class="quiet">${esc(p.method)}</p></article>`).join('')||'<p class="quiet">尚未核对入手地点。</p>'}
function detail(){const m=byId.get(trail.at(-1));if(!m)return;$('#back').textContent=trail.length>1?'← 上一只':'← 返回列表';$('#detail-content').innerHTML=`<div class="trail">${trail.map((id,i)=>`<button data-trail="${i}">${esc(label(byId.get(id)))}</button>`).join('<span>›</span>')}</div><div class="profile"><div class="art">${art(m)}</div><div><h2 id="monster-name">${esc(label(m))}</h2><span class="meta">DQM1 SP · ${esc(m.family)} · ${esc(m.rank)} 阶</span></div></div><div class="toolbar"><button data-fav="${esc(m.id)}">${save.favorites.includes(m.id)?'★ 已收藏':'☆ 收藏目标'}</button></div><div class="tabs" role="tablist" aria-label="怪物资料">${[['in','怎么合成它'],['place','入手地点'],['tree','合成树'],['stats','能力与特性'],['resist','抗性'],['out','后续用途']].map(([k,v])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${v}</button>`).join('')}</div><section role="tabpanel">${tab==='in'?(m.recipes.length?m.recipes.map(r=>`<article class="recipe"><p>${r.type==='four'?'四体配合 · 四只祖辈材料':'双亲配合'}</p><div class="parents">${r.parents.map(parent).join('<span>＋</span>')}</div>${r.note?`<p class="quiet">${esc(r.note)}</p>`:''}</article>`).join(''):'<p class="quiet">本批资料尚未收录其合成配方，先看已确认的入手方式。</p>'+acquisition(m)):tab==='place'?acquisition(m):tab==='tree'?branch(C.tree(m.id,byId)):tab==='stats'?attributes(m):tab==='resist'?resistance(m):outgoing(m)}</section><label class="alias">游戏里的别名<input id="alias" maxlength="40" value="${esc(save.aliases[m.id]||'')}" placeholder="按你的汉化名称填写，搜索也能用"></label><button id="save-alias">保存别名</button><p class="sources"><a href="${esc(m.source)}" target="_blank" rel="noopener noreferrer">查看一代资料来源 ↗</a> · 中文名暂译</p>`}
function outgoing(m){const results=D.monsters.filter(x=>x.recipes.some(r=>r.parents.includes(m.id)));return results.length?`<p class="quiet">仅列本批已收录配方。</p><div class="parents">${results.map(x=>parent(x.id)).join('')}</div>`:'<p class="quiet">本批资料没有收录后续配方。</p>'}
function open(id,historyUpdate=true){if(!byId.has(id))return;const d=$('#detail');if(!d.open){focusBefore=document.activeElement;trail=[];d.showModal()}trail.push(id);tab='in';detail();d.scrollTop=0;if(historyUpdate)history.pushState(null,'','#monster/'+encodeURIComponent(id));$('#close').focus({preventScroll:true})}
function close(){const d=$('#detail');if(d.open)d.close();trail=[];history.replaceState(null,'',location.pathname+location.search);focusBefore?.focus();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open)open(b.dataset.open);if(b.dataset.tab){tab=b.dataset.tab;detail()}if(b.dataset.trail!==undefined){trail=trail.slice(0,+b.dataset.trail+1);tab='in';detail();history.replaceState(null,'','#monster/'+trail.at(-1))}if(b.dataset.fav){const id=b.dataset.fav;save.favorites=save.favorites.includes(id)?save.favorites.filter(x=>x!==id):[...save.favorites,id];persist();detail();render()}if(b.id==='save-alias'){const value=$('#alias').value.trim();if(value)save.aliases[trail.at(-1)]=value;else delete save.aliases[trail.at(-1)];persist();detail();render();notify('别名已保存')}if(b.id==='close')close();if(b.id==='back'){if(trail.length>1){trail.pop();tab='in';detail();history.replaceState(null,'','#monster/'+trail.at(-1))}else close()}if(b.id==='favorites'){state.favorites=!state.favorites;render()}if(b.id==='reset'){state={q:'',family:'',rank:'',favorites:false};$('#search').value=$('#family').value=$('#rank').value='';render()}});
$('#detail').addEventListener('cancel',e=>{e.preventDefault();close()});for(const [s,k] of [['#search','q'],['#family','family'],['#rank','rank']])$(s).addEventListener(s==='#search'?'input':'change',e=>{state[k]=e.target.value;render()});
function route(){const id=decodeURIComponent(location.hash.replace(/^#monster\//,''));if(byId.has(id)){trail=[];open(id,false)}else if($('#detail').open){$('#detail').close();trail=[];render()}}window.addEventListener('popstate',route);render();route();

function resistance(m){return Object.entries(m.resistance||{}).map(([level,items])=>'<article class='+String.fromCharCode(34)+'place'+String.fromCharCode(34)+'><strong>'+esc(level)+'</strong><p>'+items.map(esc).join(' · ')+'</p></article>').join('')+'<p class='+String.fromCharCode(34)+'quiet'+String.fromCharCode(34)+'>仅显示来源列出的抗性；未列出的项目不推定为普通。</p>'}

function attributes(m){const names={hp:'HP',mp:'MP',attack:'攻击',defense:'防御',speed:'速度',wisdom:'智慧'};return '<h3>能力上限 <small>'+esc(m.size||'未知')+'体型</small></h3><div class="stat-grid">'+Object.entries(names).map(([k,v])=>'<div><span>'+v+'</span><strong>'+esc(m.stats?.[k]??'待核对')+'</strong></div>').join('')+'</div><p class="quiet">'+esc(D.meta.statsNote)+'</p><h3>特性</h3>'+(m.traits||[]).map(t=>'<article class="place"><strong>'+esc(t.name)+'</strong><p>'+esc(t.effect)+'</p></article>').join('')+'<p class="quiet">'+esc(D.meta.traitsNote)+'</p>'}
function renderBattle(){const b=D.battle;if(!b)return;$('#battle-panel').innerHTML='<h2>'+esc(b.title)+'</h2><p>'+esc(b.summary)+'</p><p class="quiet">'+esc(b.versionNote)+'</p><ol>'+b.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'<p class="sources"><a href="'+esc(b.source)+'" target="_blank" rel="noopener noreferrer">官方版本说明 ↗</a> · <a href="'+esc(b.guideSource)+'" target="_blank" rel="noopener noreferrer">通信攻略来源 ↗</a></p><h2>按职责找伙伴</h2><p class="quiet">'+esc(b.teamNote)+'</p><div class="role-grid">'+b.roles.map(r=>'<article class="place"><h3>'+esc(r.name)+'</h3><div class="parents">'+r.ids.map(parent).join('')+'</div><p>'+esc(r.reason)+'</p></article>').join('')+'</div>';}
document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>{const mode=b.dataset.section;document.querySelectorAll('[data-section]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));$('#catalog-panel').hidden=mode!=='catalog';$('#battle-panel').hidden=mode!=='battle';}));renderBattle();
</script></body></html>
